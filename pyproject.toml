[project]
name = "macro-econometrics-course"
version = "0.1.0"
description = "Material reproducible para curso de macroeconometría aplicada en python"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29,<8",
    "ipython>=8.20,<10",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14.4,<0.15",
    "tqdm>=4.66,<5",
    "ipywidgets>=8.1,<9",
    "macropy @ https://github.com/RenatoVassallo/MacroPy/releases/download/0.2.0/macropy-0.2.0-py3-none-any.whl",
]
