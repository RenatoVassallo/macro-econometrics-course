[project]
name = "macro-econometrics-course"
version = "0.1.0"
description = "Material reproducible para curso de macroeconometría aplicada en python"
readme = "README.md"
# MacroPy 0.2.0 exige Python 3.11: fijamos la misma ventana para que el
# resolutor falle temprano y con un mensaje claro, no a mitad de clase.
requires-python = ">=3.11,<3.12"
dependencies = [
    # Entorno de trabajo
    "ipykernel>=6.29,<8",
    "ipython>=8.20,<10",
    "ipywidgets>=8.1,<9",        # barras de progreso de tqdm dentro del notebook
    "jupyterlab>=4.2,<5",        # alternativa a VS Code
    # Cálculo y gráficos. Las cotas inferiores son las que exige MacroPy.
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scipy>=1.15,<2",
    "matplotlib>=3.8,<4",
    "statsmodels>=0.14.4,<0.15",
    "tqdm>=4.66,<5",
    # Ejecución de notebooks desde script (uso del docente)
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    # Toolbox del curso
    "macropy @ https://github.com/RenatoVassallo/MacroPy/releases/download/0.2.0/macropy-0.2.0-py3-none-any.whl",
]
